[project]
name = "morphnet"
version = "0.1.0"
description = "A bidirectional netlist parser for SPICE-family and Verilog-AMS formats, built on Lark and Protocol Buffers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "das-dias", email = "das.dias6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lark>=1.3.1",
    "mkdocs>=1.6.1",
    "mkdocs-shadcn>=0.12.1",
    "protobuf>=7.36.0",
    "pydantic>=2.13.5",
    "pydantic-yaml>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/das-dias/morphnet"
Documentation = "https://das-dias.github.io/morphnet"
Repository = "https://github.com/das-dias/morphnet"
Issues = "https://github.com/das-dias/morphnet/issues"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-shadcn>=0.12.1",
    "pygments>=2.19.0",
    "pylint>=4.0.8",
    "pymdown-extensions>=10.14.3",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ruff]
exclude = ["*_pb2.py", "*_pb2.pyi"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
