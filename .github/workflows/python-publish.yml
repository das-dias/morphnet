name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  test-pypi-publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/morphnet
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*

  test-pypi-verify:
    runs-on: ubuntu-latest
    needs: test-pypi-publish
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Wait for TestPyPI index
        run: sleep 30
      - name: Install from TestPyPI
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          uv pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "morphnet==${RELEASE_VERSION}"
      - name: Verify import
        run: uv run python -c "import morphnet"

  pypi-publish:
    runs-on: ubuntu-latest
    needs: test-pypi-verify
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/morphnet
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Publish to PyPI
        run: uv publish dist/*
