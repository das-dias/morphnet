syntax = "proto3";

package circuit;

import "simulation.proto";

// ======================================================================
// Enums
// ======================================================================

enum PortDirection {
    PORT_DIRECTION_INOUT  = 0;
    PORT_DIRECTION_INPUT  = 1;
    PORT_DIRECTION_OUTPUT = 2;
}

enum SignalDomain {
    SIGNAL_DOMAIN_UNSPECIFIED  = 0;
    SIGNAL_DOMAIN_ELECTRICAL   = 1;
    SIGNAL_DOMAIN_WAVEGUIDE    = 2;
}

enum SIPrefix {
    SI_PREFIX_UNSPECIFIED = 0;
    SI_PREFIX_QUECTO      = 1;
    SI_PREFIX_RONTO       = 2;
    SI_PREFIX_YOCTO       = 3;
    SI_PREFIX_ZEPTO       = 4;
    SI_PREFIX_ATTO        = 5;
    SI_PREFIX_FEMTO       = 6;
    SI_PREFIX_PICO        = 7;
    SI_PREFIX_NANO        = 8;
    SI_PREFIX_MICRO       = 9;
    SI_PREFIX_MILLI       = 10;
    SI_PREFIX_CENTI       = 11;
    SI_PREFIX_DECI        = 12;
    SI_PREFIX_DECA        = 13;
    SI_PREFIX_HECTO       = 14;
    SI_PREFIX_KILO        = 15;
    SI_PREFIX_MEGA        = 16;
    SI_PREFIX_GIGA        = 17;
    SI_PREFIX_TERA        = 18;
    SI_PREFIX_PETA        = 19;
    SI_PREFIX_EXA         = 20;
    SI_PREFIX_ZETTA       = 21;
    SI_PREFIX_YOTTA       = 22;
    SI_PREFIX_RONNA       = 23;
    SI_PREFIX_QUETTA      = 24;
}

enum ExternalModuleKind {
    EXTERNAL_MODULE_KIND_UNSPECIFIED = 0;
    EXTERNAL_MODULE_KIND_DEVICE     = 1;
    EXTERNAL_MODULE_KIND_MODEL      = 2;
    EXTERNAL_MODULE_KIND_NATURE     = 3;
    EXTERNAL_MODULE_KIND_DISCIPLINE = 4;
}

enum DirectiveKind {
    DIRECTIVE_KIND_UNSPECIFIED = 0;
    DIRECTIVE_KIND_INCLUDE     = 1;
    DIRECTIVE_KIND_LIB         = 2;
    DIRECTIVE_KIND_GLOBAL      = 3;
    DIRECTIVE_KIND_OPTION      = 4;
    DIRECTIVE_KIND_PARAM       = 5;
    DIRECTIVE_KIND_DEFINE      = 6;
    DIRECTIVE_KIND_TIMESCALE   = 7;
}

// ======================================================================
// Parameters
// ======================================================================

message PrefixedValue {
    double   double_value = 1;
    SIPrefix prefix       = 2;
}

message ParameterValue {
    oneof value {
        PrefixedValue  prefixed_value = 1;
        ModelReference model_ref      = 2;
        string         string_value   = 3;
        string         expression     = 4;
        int64          int_value      = 5;
    }
}

message Parameter {
    uint32         uid           = 1;
    string         name          = 10;
    ParameterValue default_value = 20;
    string         description   = 30;
    map<string, string> properties = 40;
}

message Directive {
    DirectiveKind kind  = 1;
    string        name  = 2;
    string        value = 3;
}

// ======================================================================
// Model interfaces
// ======================================================================

message ModelInterface {
    string              name          = 1;
    string              function_name = 2;
    repeated Parameter  parameters    = 10;
    map<string, string> properties    = 20;
}

message ModelReference {
    string                       model_interface_name = 1;
    map<string, ParameterValue>  arguments            = 10;
}

// ======================================================================
// Ports and connections
// ======================================================================

message Port {
    uint32        uid           = 1;
    string        name          = 10;
    PortDirection direction     = 20;
    SignalDomain  domain        = 30;
    uint32        width         = 40;
    string        cross_section = 50;
    map<string, string> properties = 60;
    string        discipline    = 61;
}

message PortReference {
    string instance_name = 1;
    string port_name     = 2;
}

message Connection {
    string        name   = 1;
    PortReference source = 10;
    PortReference target = 20;
    SignalDomain  domain = 30;
    uint32        weight = 40;
    map<string, string> properties = 50;
}

message Bus {
    string              name        = 1;
    uint32              width       = 10;
    SignalDomain        domain      = 20;
    repeated Connection connections = 30;
    map<string, string> properties  = 40;
}

// ======================================================================
// Module hierarchy
// ======================================================================

message ModuleReference {
    string                      name                = 1;
    string                      module_name         = 2;
    string                      class_name          = 3;
    repeated Parameter          parameters          = 10;
    map<string, Parameter> parameter_overrides = 20;
    map<string, string>         properties          = 30;
    string                      model_name          = 31;
}

message Module {
    uint32                    uid               = 1;
    string                    name              = 2;
    string                    class_name        = 3;
    repeated Port             ports             = 10;
    repeated Parameter        parameters        = 20;
    repeated ModelInterface   model_interfaces  = 30;
    repeated ModuleReference  module_references = 40;
    repeated Connection       connections       = 50;
    repeated Bus              buses             = 60;
    map<string, string>       properties        = 70;
    repeated Directive        directives        = 71;
}

message ExternalModule {
    string              name       = 1;
    string              domain     = 2;
    repeated Port       ports      = 10;
    repeated Parameter  parameters = 20;
    map<string, string> properties = 30;
    ExternalModuleKind  kind       = 31;
}

// ======================================================================
// Circuit (top-level container)
// ======================================================================

message Circuit {
    string                   name        = 1;
    string                   domain      = 2;
    string                   top_module  = 3;
    repeated Module          modules     = 10;
    repeated ExternalModule  ext_modules = 20;
    map<string, string>      properties  = 30;
    repeated Directive       directives  = 31;
    Simulation               simulation  = 40;
}
